versao_schema: 2
projeto: Biblioteca Comunitária
metodologia: scrum
gerado_em: '2026-10-21'
epicos:
- id: EP001
  titulo: Acervo e sócios
  historias:
  - id: US001
    titulo: Cadastrar livro
    prioridade: Must
    mvp: true
    historia: Como bibliotecária, quero cadastrar livros no acervo para controlar quais títulos estão
      disponíveis.
    regras_de_negocio: {}
    criterios:
    - id: AC001.1
      tipo: BDD
      texto: Dado que a bibliotecária está autenticada Quando informa título, autor e código do livro
        e confirma Então o livro aparece na lista do acervo com status "disponível"
    - id: AC001.2
      tipo: EARS
      texto: Se o código informado já existir no acervo, então o sistema deve recusar o cadastro e exibir
        a mensagem "Código já cadastrado".
    casos_de_teste:
    - CT001.1.1
    - CT001.2.1
    tasks:
    - id: TSK002
      titulo: Modelar e migrar tabelas livro, sócio e empréstimo
      tipo: dados
      estimativa: 3.0
      confianca: alta
      depende_de: &id004
      - TSK001
      refs: &id005
      - US001
      - US002
      - US003
      - AC001.1
      descricao: criar entidades conforme er.mmd e migrações.
      dod:
      - migrações aplicam e revertem sem erro
      - restrições de unicidade para código do livro e carteirinha
      casos_de_teste: []
    - id: TSK003
      titulo: API de cadastro de livros
      tipo: backend
      estimativa: 3.0
      confianca: alta
      depende_de: &id008
      - TSK002
      refs: &id009
      - US001
      - AC001.1
      - AC001.2
      descricao: endpoint de criação e listagem com validação de código duplicado.
      dod:
      - AC001.1 e AC001.2 atendidos
      - revisão de código
      casos_de_teste:
      - CT001.1.1
      - CT001.2.1
    - id: TSK004
      titulo: Autenticação da bibliotecária
      tipo: seguranca
      estimativa: 3.0
      confianca: media
      depende_de: &id006
      - TSK001
      refs: &id007
      - RNF002
      - US001
      descricao: login com política de senha de 10 caracteres ou mais.
      dod:
      - rotas da bibliotecária exigem sessão válida
      - política de senha aplicada
      casos_de_teste: []
    - id: TSK008
      titulo: Telas da bibliotecária (livros, sócios, empréstimo, devolução)
      tipo: frontend
      estimativa: 5.0
      confianca: media
      depende_de: &id018
      - TSK006
      - TSK007
      refs: &id019
      - US001
      - US002
      - US003
      - US004
      descricao: interface web responsiva consumindo as APIs.
      dod:
      - fluxos principais navegáveis ponta a ponta
      - revisão de usabilidade com a bibliotecária
      casos_de_teste: []
  - id: US002
    titulo: Cadastrar sócio
    prioridade: Must
    mvp: true
    historia: Como bibliotecária, quero cadastrar sócios para registrar quem pode pegar livros emprestados.
    regras_de_negocio: {}
    criterios:
    - id: AC002.1
      tipo: BDD
      texto: Dado que a bibliotecária está autenticada Quando informa nome e telefone do sócio e confirma
        Então o sistema gera um número de carteirinha único e exibe o sócio como "ativo"
    casos_de_teste:
    - CT002.1.1
    tasks:
    - id: TSK005
      titulo: API de cadastro de sócios
      tipo: backend
      estimativa: 2.0
      confianca: alta
      depende_de: &id010
      - TSK002
      refs: &id011
      - US002
      - AC002.1
      descricao: criação de sócio com geração de número de carteirinha único.
      dod:
      - AC002.1 atendido
      casos_de_teste:
      - CT002.1.1
- id: EP002
  titulo: Empréstimos
  historias:
  - id: US003
    titulo: Registrar empréstimo
    prioridade: Must
    mvp: true
    historia: Como bibliotecária, quero registrar o empréstimo de um livro a um sócio para controlar prazos
      e disponibilidade.
    regras_de_negocio:
      RN001: O prazo de empréstimo é de 14 dias corridos.
      RN002: Cada sócio pode ter no máximo 3 empréstimos ativos.
    criterios:
    - id: AC003.1
      tipo: BDD
      texto: Dado que o livro está disponível e o sócio possui menos de 3 empréstimos ativos Quando a
        bibliotecária registra o empréstimo Então o livro passa a "emprestado" e a data de vencimento
        é a data atual mais 14 dias
    - id: AC003.2
      tipo: EARS
      texto: Se o sócio já possuir 3 empréstimos ativos, então o sistema deve impedir o novo empréstimo
        e informar o limite.
    - id: AC003.3
      tipo: EARS
      texto: Se o livro estiver com status "emprestado", então o sistema deve impedir o empréstimo e informar
        a data prevista de devolução.
    casos_de_teste:
    - CT003.1.1
    - CT003.2.1
    - CT003.3.1
    tasks:
    - id: TSK006
      titulo: API de empréstimo com regras de prazo e limite
      tipo: backend
      estimativa: 5.0
      confianca: media
      depende_de: &id012
      - TSK003
      - TSK005
      refs: &id013
      - US003
      - AC003.1
      - AC003.2
      - AC003.3
      - RN001
      - RN002
      descricao: registrar empréstimo calculando vencimento e validando limite e disponibilidade.
      dod:
      - AC003.1 a AC003.3 atendidos
      - cenário concorrente de dois empréstimos do mesmo livro coberto
      casos_de_teste:
      - CT003.1.1
      - CT003.2.1
      - CT003.3.1
  - id: US004
    titulo: Registrar devolução com multa
    prioridade: Must
    mvp: true
    historia: Como bibliotecária, quero registrar a devolução e calcular a multa de atraso para liberar
      o livro e cobrar o valor devido.
    regras_de_negocio:
      RN003: A multa é de R$ 0,50 por dia corrido de atraso, sem teto.
    criterios:
    - id: AC004.1
      tipo: BDD
      texto: Dado que existe um empréstimo ativo vencido há 4 dias Quando a bibliotecária registra a devolução
        Então o livro volta a "disponível" e o sistema exibe multa de R$ 2,00
    - id: AC004.2
      tipo: EARS
      texto: Quando a devolução ocorrer até a data de vencimento, o sistema deve concluir a devolução
        sem multa.
    casos_de_teste:
    - CT004.1.1
    - CT004.2.1
    tasks:
    - id: TSK007
      titulo: API de devolução e cálculo de multa
      tipo: backend
      estimativa: 3.0
      confianca: alta
      depende_de: &id014
      - TSK006
      refs: &id015
      - US004
      - AC004.1
      - AC004.2
      - RN003
      descricao: registrar devolução, liberar livro e calcular multa por dia corrido.
      dod:
      - AC004.1 e AC004.2 atendidos
      casos_de_teste:
      - CT004.1.1
      - CT004.2.1
  - id: US005
    titulo: Consultar meus empréstimos
    prioridade: Should
    mvp: false
    historia: Como sócio, quero consultar meus empréstimos e vencimentos pelo celular para devolver os
      livros no prazo.
    regras_de_negocio: {}
    criterios:
    - id: AC005.1
      tipo: BDD
      texto: Dado que o sócio informa seu número de carteirinha Quando abre a consulta Então vê a lista
        de livros emprestados com a data de vencimento de cada um
    casos_de_teste:
    - CT005.1.1
    tasks:
    - id: TSK009
      titulo: Consulta de empréstimos do sócio (mobile)
      tipo: frontend
      estimativa: 3.0
      confianca: media
      depende_de: &id016
      - TSK006
      refs: &id017
      - US005
      - AC005.1
      - RNF001
      descricao: página responsiva de consulta por número de carteirinha.
      dod:
      - AC005.1 atendido
      - p95 abaixo de 2 s medido em teste de carga leve
      casos_de_teste:
      - CT005.1.1
