projeto: Biblioteca Comunitária
ignorar:
- '*.md'
- tests/**
- migrations/**
stack:
- camada: Backend
  itens:
  - nome: django-drf
    uso: Stack declarada no projeto
- camada: Banco
  itens:
  - nome: postgres
    uso: Stack declarada no projeto
- camada: Infra
  itens:
  - nome: paas
    uso: Stack declarada no projeto
requisitos:
- id: RNF001
  titulo: A consulta do sócio deve carregar em menos de 2 segundos no p95 em conexão 4G.
  tipo: nao_funcional
- id: RNF002
  titulo: O acesso à área da bibliotecária exige autenticação com senha de no mínimo 10 caracteres.
  tipo: nao_funcional
casos_de_uso:
- id: UC001
  titulo: Cadastrar livro
  historia_id: US001
  requisitos:
  - RNF002
  criterios_aceitacao:
  - id: AC001.1
    descricao: Dado que a bibliotecária está autenticada Quando informa título, autor e código do livro e confirma
      Então o livro aparece na lista do acervo com status "disponível"
    tipo: BDD
  - id: AC001.2
    descricao: Se o código informado já existir no acervo, então o sistema deve recusar o cadastro e exibir a mensagem
      "Código já cadastrado".
    tipo: EARS
- id: UC002
  titulo: Cadastrar sócio
  historia_id: US002
  requisitos: []
  criterios_aceitacao:
  - id: AC002.1
    descricao: Dado que a bibliotecária está autenticada Quando informa nome e telefone do sócio e confirma Então
      o sistema gera um número de carteirinha único e exibe o sócio como "ativo"
    tipo: BDD
- id: UC003
  titulo: Registrar empréstimo
  historia_id: US003
  requisitos: []
  criterios_aceitacao:
  - id: AC003.1
    descricao: Dado que o livro está disponível e o sócio possui menos de 3 empréstimos ativos Quando a bibliotecária
      registra o empréstimo Então o livro passa a "emprestado" e a data de vencimento é a data atual mais 14 dias
    tipo: BDD
  - id: AC003.2
    descricao: Se o sócio já possuir 3 empréstimos ativos, então o sistema deve impedir o novo empréstimo e informar
      o limite.
    tipo: EARS
  - id: AC003.3
    descricao: Se o livro estiver com status "emprestado", então o sistema deve impedir o empréstimo e informar
      a data prevista de devolução.
    tipo: EARS
- id: UC004
  titulo: Registrar devolução com multa
  historia_id: US004
  requisitos: []
  criterios_aceitacao:
  - id: AC004.1
    descricao: Dado que existe um empréstimo ativo vencido há 4 dias Quando a bibliotecária registra a devolução
      Então o livro volta a "disponível" e o sistema exibe multa de R$ 2,00
    tipo: BDD
  - id: AC004.2
    descricao: Quando a devolução ocorrer até a data de vencimento, o sistema deve concluir a devolução sem multa.
    tipo: EARS
- id: UC005
  titulo: Consultar meus empréstimos
  historia_id: US005
  requisitos:
  - RNF001
  criterios_aceitacao:
  - id: AC005.1
    descricao: Dado que o sócio informa seu número de carteirinha Quando abre a consulta Então vê a lista de livros
      emprestados com a data de vencimento de cada um
    tipo: BDD
uml: []
tasks:
- id: TSK001
  titulo: Preparar repositório, CI e deploy em PaaS
  caso_de_uso: null
  depende_de: []
  criterios:
  - id: C1
    descricao: criar repositório, pipeline de CI e ambiente de homologação com PostgreSQL.
    usar_ia: true
  - id: C2
    descricao: pipeline roda testes em todo PR
    usar_ia: true
  - id: C3
    descricao: ambiente de homologação acessível
    usar_ia: true
- id: TSK002
  titulo: Modelar e migrar tabelas livro, sócio e empréstimo
  caso_de_uso: UC001
  depende_de:
  - TSK001
  criterios:
  - id: C1
    descricao: criar entidades conforme er.mmd e migrações.
    usar_ia: true
  - id: C2
    descricao: migrações aplicam e revertem sem erro
    usar_ia: true
  - id: C3
    descricao: restrições de unicidade para código do livro e carteirinha
    usar_ia: true
- id: TSK003
  titulo: API de cadastro de livros
  caso_de_uso: UC001
  depende_de:
  - TSK002
  criterios:
  - id: C1
    descricao: endpoint de criação e listagem com validação de código duplicado.
    usar_ia: true
  - id: C2
    descricao: AC001.1 e AC001.2 atendidos
    usar_ia: true
  - id: C3
    descricao: revisão de código
    usar_ia: true
- id: TSK004
  titulo: Autenticação da bibliotecária
  caso_de_uso: UC001
  depende_de:
  - TSK001
  criterios:
  - id: C1
    descricao: login com política de senha de 10 caracteres ou mais.
    usar_ia: true
  - id: C2
    descricao: rotas da bibliotecária exigem sessão válida
    usar_ia: true
  - id: C3
    descricao: política de senha aplicada
    usar_ia: true
- id: TSK005
  titulo: API de cadastro de sócios
  caso_de_uso: UC002
  depende_de:
  - TSK002
  criterios:
  - id: C1
    descricao: criação de sócio com geração de número de carteirinha único.
    usar_ia: true
  - id: C2
    descricao: AC002.1 atendido
    usar_ia: true
- id: TSK006
  titulo: API de empréstimo com regras de prazo e limite
  caso_de_uso: UC003
  depende_de:
  - TSK003
  - TSK005
  criterios:
  - id: C1
    descricao: registrar empréstimo calculando vencimento e validando limite e disponibilidade.
    usar_ia: true
  - id: C2
    descricao: AC003.1 a AC003.3 atendidos
    usar_ia: true
  - id: C3
    descricao: cenário concorrente de dois empréstimos do mesmo livro coberto
    usar_ia: true
- id: TSK007
  titulo: API de devolução e cálculo de multa
  caso_de_uso: UC004
  depende_de:
  - TSK006
  criterios:
  - id: C1
    descricao: registrar devolução, liberar livro e calcular multa por dia corrido.
    usar_ia: true
  - id: C2
    descricao: AC004.1 e AC004.2 atendidos
    usar_ia: true
- id: TSK008
  titulo: Telas da bibliotecária (livros, sócios, empréstimo, devolução)
  caso_de_uso: UC001
  depende_de:
  - TSK006
  - TSK007
  criterios:
  - id: C1
    descricao: interface web responsiva consumindo as APIs.
    usar_ia: true
  - id: C2
    descricao: fluxos principais navegáveis ponta a ponta
    usar_ia: true
  - id: C3
    descricao: revisão de usabilidade com a bibliotecária
    usar_ia: true
- id: TSK009
  titulo: Consulta de empréstimos do sócio (mobile)
  caso_de_uso: UC005
  depende_de:
  - TSK006
  criterios:
  - id: C1
    descricao: página responsiva de consulta por número de carteirinha.
    usar_ia: true
  - id: C2
    descricao: AC005.1 atendido
    usar_ia: true
  - id: C3
    descricao: p95 abaixo de 2 s medido em teste de carga leve
    usar_ia: true
