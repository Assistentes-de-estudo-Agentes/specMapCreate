projeto:
  nome: Biblioteca Comunitária
  descricao: ''
  objetivo: ''
  stack:
    backend: django-drf
    banco: postgres
    infra: paas
requisitos_funcionais: []
requisitos_nao_funcionais:
- id: RNF001
  descricao: A consulta do sócio deve carregar em menos de 2 segundos no p95 em conexão 4G.
- id: RNF002
  descricao: O acesso à área da bibliotecária exige autenticação com senha de no mínimo 10 caracteres.
regras_de_negocio:
- id: RN001
  descricao: O prazo de empréstimo é de 14 dias corridos.
- id: RN002
  descricao: Cada sócio pode ter no máximo 3 empréstimos ativos.
- id: RN003
  descricao: A multa é de R$ 0,50 por dia corrido de atraso, sem teto.
casos_de_uso:
- id: UC001
  nome: Cadastrar livro
  historia_id: US001
  ator: bibliotecária
  requisitos:
  - RNF002
  historia: Como bibliotecária, quero cadastrar livros no acervo para controlar quais títulos estão disponíveis.
  prioridade: Must
  mvp: sim
  criterios_aceitacao:
  - id: AC001.1
    tipo: BDD
    descricao: Dado que a bibliotecária está autenticada Quando informa título, autor e código do livro e confirma
      Então o livro aparece na lista do acervo com status "disponível"
  - id: AC001.2
    tipo: EARS
    descricao: Se o código informado já existir no acervo, então o sistema deve recusar o cadastro e exibir a mensagem
      "Código já cadastrado".
- id: UC002
  nome: Cadastrar sócio
  historia_id: US002
  ator: bibliotecária
  requisitos: []
  historia: Como bibliotecária, quero cadastrar sócios para registrar quem pode pegar livros emprestados.
  prioridade: Must
  mvp: sim
  criterios_aceitacao:
  - id: AC002.1
    tipo: BDD
    descricao: Dado que a bibliotecária está autenticada Quando informa nome e telefone do sócio e confirma Então
      o sistema gera um número de carteirinha único e exibe o sócio como "ativo"
- id: UC003
  nome: Registrar empréstimo
  historia_id: US003
  ator: bibliotecária
  requisitos: []
  historia: Como bibliotecária, quero registrar o empréstimo de um livro a um sócio para controlar prazos e disponibilidade.
  prioridade: Must
  mvp: sim
  criterios_aceitacao:
  - id: AC003.1
    tipo: BDD
    descricao: Dado que o livro está disponível e o sócio possui menos de 3 empréstimos ativos Quando a bibliotecária
      registra o empréstimo Então o livro passa a "emprestado" e a data de vencimento é a data atual mais 14 dias
  - id: AC003.2
    tipo: EARS
    descricao: Se o sócio já possuir 3 empréstimos ativos, então o sistema deve impedir o novo empréstimo e informar
      o limite.
  - id: AC003.3
    tipo: EARS
    descricao: Se o livro estiver com status "emprestado", então o sistema deve impedir o empréstimo e informar
      a data prevista de devolução.
- id: UC004
  nome: Registrar devolução com multa
  historia_id: US004
  ator: bibliotecária
  requisitos: []
  historia: Como bibliotecária, quero registrar a devolução e calcular a multa de atraso para liberar o livro e
    cobrar o valor devido.
  prioridade: Must
  mvp: sim
  criterios_aceitacao:
  - id: AC004.1
    tipo: BDD
    descricao: Dado que existe um empréstimo ativo vencido há 4 dias Quando a bibliotecária registra a devolução
      Então o livro volta a "disponível" e o sistema exibe multa de R$ 2,00
  - id: AC004.2
    tipo: EARS
    descricao: Quando a devolução ocorrer até a data de vencimento, o sistema deve concluir a devolução sem multa.
- id: UC005
  nome: Consultar meus empréstimos
  historia_id: US005
  ator: sócio
  requisitos:
  - RNF001
  historia: Como sócio, quero consultar meus empréstimos e vencimentos pelo celular para devolver os livros no prazo.
  prioridade: Should
  mvp: não
  criterios_aceitacao:
  - id: AC005.1
    tipo: BDD
    descricao: Dado que o sócio informa seu número de carteirinha Quando abre a consulta Então vê a lista de livros
      emprestados com a data de vencimento de cada um
